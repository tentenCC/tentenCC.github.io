<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大会オッズ</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1f2328;--muted:#6b7280;--line:#d0d5dd;--primary:#15803d;--primary-d:#166534;--danger:#dc2626;--gold:#b45309}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Sans","Meiryo","Yu Gothic UI",system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{background:#14532d;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px}
header a{color:#fff;text-decoration:none}
header h1{margin:0;font-size:20px}
header .sub{font-size:12px;opacity:.8}
main{max-width:1200px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:14px 0 6px}
label{font-size:13px;font-weight:600;display:block;margin:12px 0 4px}
input[type=text],input[type=number],input[type=password],textarea,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:14px;background:#fff}
textarea{height:180px;resize:vertical}
button{font:inherit;font-size:14px;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}
button:hover{background:#f3f4f6}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
button.primary:hover{background:var(--primary-d)}
button.danger{color:var(--danger);border-color:#fca5a5}
button.small{font-size:12px;padding:4px 8px}
.wide{width:100%}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:4px 0 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.err{color:var(--danger);font-size:13px;margin-top:8px;min-height:1em}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.badge.open{background:#dcfce7;color:#166534}
.badge.closed{background:#fef3c7;color:#92400e}
.badge.settled{background:#e5e7eb;color:#374151}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid #eef0f3}
.list li:first-child{border-top:none}
.list a{color:inherit;text-decoration:none;font-weight:700;flex:1}
.list .meta{font-size:12px;color:var(--muted)}
.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:14px}
/* オッズボード */
.tHead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tHead h2{margin:0;font-size:20px;flex:1}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.stats b{color:var(--text);font-size:16px}
.board{width:100%;border-collapse:collapse;margin-top:12px}
.board th{font-size:12px;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
.board td{padding:8px;border-bottom:1px solid #eef0f3;vertical-align:middle}
.role{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:2px;white-space:nowrap;background:#f3f4f6;color:#374151}
td>.role:first-child{margin-left:0}
.role.r-beg{background:#dcfce7;color:#166534}
.role.r-ob{background:#dbeafe;color:#1e40af}
.role.r-par{background:#fce7f3;color:#9d174d}
.role.r-top{background:#fef3c7;color:#92400e}
.big .role{font-size:13px;vertical-align:4px}
.board th.sort{cursor:pointer;user-select:none}
.board th.sort:hover{color:var(--text)}
.board th.sort .arrow{font-size:10px;margin-left:3px;opacity:.5}
.board th.sorted{color:var(--primary)}
.board th.sorted .arrow{opacity:1}
.board tr.pick{cursor:pointer}
.board tr.pick:hover td{background:#f0fdf4}
.board tr.sel td{background:#dcfce7}
.board tr.win td{background:#fef3c7}
.num{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:4px;font-weight:800;font-size:14px;border:1px solid #9ca3af}
.ename{font-weight:700;font-size:15px;word-break:break-all}
.odds{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.odds.fav{color:var(--danger)}
.odds.none{color:#9ca3af;font-size:16px}
.pop{font-size:12px;color:var(--muted);text-align:center;white-space:nowrap}
.pop.p1{color:var(--danger);font-weight:700}
.bar{height:8px;background:#eef0f3;border-radius:4px;overflow:hidden;min-width:60px}
.bar span{display:block;height:100%;background:#22c55e}
.votes{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:600px){.hideSm{display:none}}
/* 投票パネル */
.balance{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.balance small{font-size:14px;font-weight:600;color:var(--muted)}
.selName{font-size:16px;font-weight:700;padding:8px;border:1px dashed var(--line);border-radius:6px;min-height:40px;background:#fafafa}
.quick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.quick button{flex:1;font-size:12px;padding:6px 4px}
.est{font-size:13px;background:#f0fdf4;border-radius:6px;padding:8px;margin-top:10px;line-height:1.7}
.est b{font-size:16px}
.mybets li{font-size:13px}
.mybets .amt{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.hit{color:var(--gold);font-weight:700}
.rank td{font-size:13px;padding:5px 6px;border-bottom:1px solid #eef0f3}
.rank{width:100%;border-collapse:collapse}
.rank td.r{text-align:right;font-variant-numeric:tabular-nums}
.adminBox{border:2px solid #fbbf24}
.keyBox{font-family:Consolas,monospace;background:#f3f4f6;padding:8px;border-radius:6px;word-break:break-all;font-size:13px;user-select:all}
.result{background:linear-gradient(90deg,#fef3c7,#fde68a);border-radius:10px;padding:14px 16px;font-size:15px}
.result b{font-size:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.demo{background:#fef3c7;color:#92400e;font-size:13px;padding:8px 16px;text-align:center}
.demo[hidden]{display:none}
header{flex-wrap:wrap}
header .sub{flex:1;min-width:160px}
nav{display:flex;gap:4px}
nav a{padding:6px 12px;border-radius:6px;font-size:14px;opacity:.85}
nav a:hover{background:rgba(255,255,255,.12);opacity:1}
nav a.on{background:rgba(255,255,255,.2);opacity:1;font-weight:700}
.ename .members{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.ename .info{font-size:11px;font-weight:600;color:var(--primary);border:1px solid #bbf7d0;border-radius:4px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.board tr.pick,.board tr.view{cursor:pointer}
.board tr.view:hover td{background:#f8fafc}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow:auto}
.modal[hidden]{display:none}
.modal-box{background:#fff;border-radius:12px;padding:20px;width:min(640px,100%);box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.modal-head h2{flex:1;margin:0;font-size:20px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.mcard{border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;margin-top:10px}
.mcard .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mcard .nm{font-weight:700;font-size:15px}
.mcard .nm a{color:inherit}
.mcard .note{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;background:#f3f4f6;border-radius:999px;padding:2px 10px;white-space:nowrap}
.chip.gold{background:#fef3c7;color:#92400e;font-weight:700}
.rec{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.rec th{font-size:11px;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.rec td{padding:5px 6px;border-bottom:1px solid #f1f5f9}
.rec td.rk{white-space:nowrap;font-weight:700}
.rec td.rk.r1{color:var(--gold)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid #eef0f3}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.link{cursor:pointer}
.tbl tr.link:hover td{background:#f0fdf4}
.rankIn{width:70px !important;text-align:right}
.back{font-size:13px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--text)}
.big{font-size:22px;font-weight:800}
.statGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.statGrid div{background:#f8fafc;border-radius:8px;padding:10px;text-align:center}
.statGrid b{display:block;font-size:20px}
.statGrid span{font-size:12px;color:var(--muted)}
@media (max-width:600px){.statGrid{grid-template-columns:repeat(2,1fr)}}
.teamRow{border:1px solid #e5e7eb;border-radius:8px;padding:8px;margin-top:8px;background:#fafafa}
.picker{position:relative;border:1px solid var(--line);border-radius:6px;padding:6px;background:#fff}
.pkSel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;min-height:24px;align-items:center}
.pkChip{display:inline-flex;align-items:center;gap:4px;background:#dcfce7;color:#166534;border-radius:999px;padding:2px 4px 2px 10px;font-size:13px;font-weight:600}
.pkChip.new{background:#fef3c7;color:#92400e}
.pkChip small{font-size:10px;font-weight:400}
.pkChip button{border:none;background:transparent;padding:0 6px;font-size:14px;line-height:1;color:inherit;cursor:pointer}
.pkChip button:hover{background:rgba(0,0,0,.08)}
.picker .pkIn{border:1px dashed var(--line)}
.pkList{position:absolute;left:0;right:0;top:100%;margin-top:2px;background:#fff;border:1px solid var(--line);border-radius:6px;max-height:240px;overflow:auto;z-index:30;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.pkList[hidden]{display:none}
.pkItem{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:none;border-radius:0;padding:7px 10px;font-size:14px;background:#fff}
button.pkItem:hover{background:#f0fdf4}
.pkItem small{color:var(--muted);font-size:12px}
.pkItem.off{color:#9ca3af;cursor:default}
.pkItem.add{color:var(--primary);font-weight:600;border-top:1px solid #eef0f3}
</style>
</head>
<body>
<header>
  <a href="#/"><h1>🏆 大会オッズ</h1></a>
  <span class="sub">優勝予想の投票数でオッズが決まる予想システム（ポイント制）</span>
  <nav>
    <a href="#/" data-nav="home">大会</a>
    <a href="#/members" data-nav="members">メンバー</a>
    <a href="#/admin" data-nav="admin" id="navAdmin">管理</a>
  </nav>
</header>
<div class="demo" id="demoBar" hidden>デモモード：Firebase が未設定のため、データはこのブラウザ内だけに保存されます（タブごとに別の参加者になります）。</div>
<main id="app"><div class="card empty">読み込み中…</div></main>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" hidden><div class="modal-box" id="modalBox" role="dialog" aria-modal="true"></div></div>

<script type="module" src="app.js"></script>
</body>
</html>
